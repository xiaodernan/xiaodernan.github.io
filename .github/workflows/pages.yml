name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
    # Only genuine page changes ship immediately. Fact-pack syncs under
    # assets/** ride the cron below instead of cancelling each other.
    paths:
      - 'index.html'
      - '404.html'
      - 'README.md'
      - 'specproof-web/**'
      - 'assets/*.png'
      - 'assets/*.svg'
      - 'scripts/identity-guard.mjs'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 */3 * * *'   # every 3h at :17 — bundles fact-pack syncs, keeps the live IO fresh without a deploy per sync push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identity guard — block the deploy before broken facts reach the public page
        run: node scripts/identity-guard.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
