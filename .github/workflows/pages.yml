name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
    # Fact packs land every ~2 minutes and several of them edit index.html.
    # The push trigger is for the app shell only; index.html and assets/**
    # ride the cron below. One deploy per 3 hours beats 30 cancelled ones.
    paths:
      - '404.html'
      - 'README.md'
      - 'specproof-web/**'
      - 'assets/*.png'
      - 'assets/*.svg'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 */3 * * *'   # every 3h at :17 鈥?bundles fact packs + homepage ribbon edits into one deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # serialize instead of preempting 鈥?a deploy must never lose to the next sync bot push

jobs:
  deploy:
    # Hosted runner queue on this account is saturated (deploys sat for >1h and were cancelled);
    # this repo already has two online self-hosted Windows runners (lenovo-pages, lenovo-pages-2)
    # dedicated to it. Join those instead of the shared queue. Identity guard still gates.
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identity guard 鈥?block the deploy before broken facts reach the public page
        run: node scripts/identity-guard.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
