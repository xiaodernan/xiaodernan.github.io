name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
    # Fact packs land every ~2 minutes and several of them edit index.html.
    # The push trigger is for the app shell only; index.html and assets/**
    # ride the cron below. One deploy per 3 hours beats 30 cancelled ones.
    paths:
      - '404.html'
      - 'README.md'
      - 'specproof-web/**'
      - 'assets/*.png'
      - 'assets/*.svg'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 */3 * * *'   # every 3h at :17 鈥?bundles fact packs + homepage ribbon edits into one deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # serialize instead of preempting 鈥?a deploy must never lose to the next sync bot push

jobs:
  deploy:
    # Hosted runner queue on this account is saturated (deploys sat for >1h and were cancelled);
    # this repo already has two online self-hosted Windows runners (lenovo-pages, lenovo-pages-2)
    # dedicated to it. Join those instead of the shared queue. Identity guard still gates.
    #
    # 2026-11-19 (3rd runner revert — read before flipping back):
    #   actions/upload-pages-artifact@v3 REQUIRES /bin/bash (its tar step runs through WSL).
    #   The lenovo-pages runner has NO WSL distro — the relay dies at
    #   "execvpe(/bin/bash) failed: No such file or directory", so EVERY deploy on the
    #   self-hosted Windows runner fails deterministically at the Upload artifact step
    #   (10:24Z 44505338842 · 10:33Z 44506780662 · 07:44Z 44481887159).
    #   Measured evidence across 2026-11-19: ubuntu-latest = green deploys
    #   (08:51·08:59·09:15·09:21·09:27·09:30·09:51Z); lenovo-pages = 0/4 green.
    #   To re-enable the Windows runners: install a WSL distro with /bin/bash on lenovo-pages,
    #   OR build the tar with Windows' built-in tar.exe + actions/upload-artifact@v4
    #   (artifact named github-pages) — unverified here, so do not flip blindly.
    #   identity-guard.yml is intentionally left on the self-hosted runner (node-only, works there).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identity guard 鈥?block the deploy before broken facts reach the public page
        run: node scripts/identity-guard.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # WSL is broken on this Windows runner (docker-desktop busybox distro
      # has /bin/sh but no /bin/bash) — actions/upload-pages-artifact@v3
      # hard-requires bash on Windows. Archive locally with GNU tar (bundled
      # with Git for Windows) in pwsh, then upload with upload-artifact@v4.
      # Artifact contract is unchanged: a single artifact named 'github-pages'
      # holding 'artifact.tar' (<10 GB, no symlinks) — exactly what
      # deploy-pages@v4 consumes.
      - name: Archive artifact (pwsh, no WSL bash)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tar = Join-Path $env:RUNNER_TEMP 'artifact.tar'
          if (Test-Path $tar) { Remove-Item $tar -Force }
          $gnu = 'C:\Program Files\Git\usr\bin\tar.exe'
          if (Test-Path $gnu) {
            & $gnu --dereference --hard-dereference --directory "$env:GITHUB_WORKSPACE" -cf $tar --exclude='.git' --exclude='.github' --force-local '.'
          } else {
            & "$env:WINDIR\System32\tar.exe" --dereference --directory "$env:GITHUB_WORKSPACE" -cf $tar --exclude='.git' --exclude='.github' --force-local '.'
          }
          Write-Host "artifact.tar bytes: $((Get-Item $tar).Length)"

      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
