name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
    # Fact packs land every ~2 minutes and several of them edit index.html.
    # The push trigger is for the app shell only; index.html and assets/**
    # ride the cron below. One deploy per 3 hours beats 30 cancelled ones.
    paths:
      - '404.html'
      - 'README.md'
      - 'specproof-web/**'
      - 'assets/*.png'
      - 'assets/*.svg'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 */3 * * *'   # every 3h at :17 — bundles fact packs + homepage ribbon edits into one deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # serialize instead of preempting — a deploy must never lose to the next sync bot push

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identity guard — block the deploy before broken facts reach the public page
        run: node scripts/identity-guard.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
