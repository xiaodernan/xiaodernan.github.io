name: site-gates

# 五道闸门：身份信息不可回归（identity-guard）、每个可操作元素都有教学说明
# （tooltip-audit）、中英两语不互相夹杂（lang-audit）、GitHub 事实包的静态半区
# 与事实包一致（paint-fact-packs --check）、GitHub 数字面板的针脚仍命中
# （gh-stats-check）。任何一个红灯都不允许合并。
on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'manual.html'
      - 'admin.html'
      - 'script.js'
      - 'styles.css'
      - 'scripts/**'
      - 'data/**'
      - 'assets/nexus-platform/latest.json'
      - 'assets/football/latest.json'
      - '.github/workflows/site-gates.yml'
      - '.github/workflows/sync-football-os.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'manual.html'
      - 'admin.html'
      - 'script.js'
      - 'styles.css'
      - 'scripts/**'
      - 'data/**'
      - 'assets/nexus-platform/latest.json'
      - 'assets/football/latest.json'
      - '.github/workflows/sync-football-os.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identity / forbidden-word / portrait / NaN gate
        run: node scripts/identity-guard.mjs
      - name: Homepage JavaScript syntax gate
        run: node --check script.js
      # The GitHub figures panel is restated by scripts/gh-stats.mjs on a weekly schedule. This step
      # exercises the SAME restatement code offline with synthetic figures, so a needle that stops
      # matching the page's wording reddens the run here instead of freezing one visible number
      # (that is exactly how the MiB footnote drifted away from the stat block last time).
      - name: GitHub figures restatement gate (needles + placement, no network)
        run: node scripts/gh-stats-check.mjs
      - name: Teaching tooltip coverage gate
        run: node scripts/tooltip-audit.mjs
      - name: Bilingual no-mixing gate
        run: node scripts/lang-audit.mjs
      # 2026-11-23 · 静态半区与事实包一致性闸门。
      #
      # 事实包卡片的运行时（index.html 内联的 refreshNp）会按当前语言刷两半，用的是事实包自带的
      # 中文镜像 features_zh；而**静态半区**是人手维护的——上次有人更新那张卡时把英文原文粘进了
      # 中文半区，于是中文模式里出现一整句英文，lang-audit 红灯，主干 CI 变红。
      #
      # 这个闸门只判定"静态半区 == 事实包"，离线可跑（读本仓的 assets/*/latest.json），
      # 所以人手改一次静态半区就红一次，而不是等下一周事实包刷新时中文模式又漏一句英文。
      - name: Fact-pack static half agrees with the fact pack
        run: node scripts/paint-fact-packs.mjs --check
      - name: Football OS static figures agree with the fact pack
        run: node scripts/sync-football-os.mjs --check
      # 2026-11-24 · 首页跨界纪元事实条的双语兜底值与事实包同值。
      # 运行时 JS 会刷新它，但 JS 没跑起来时玩家看到的是手写值——两份语言曾各写 611 / 587。
      - name: Crossrealm ribbon fallback agrees across locales and with the fact pack
        run: node scripts/crossrealm-ribbon-guard.mjs
      # 2026-11-23 · 结构闸门。
      #
      # 抓到过两个**真的坏掉**的东西：
      #   ① 切换语言时 applyLang 用 replaceWith 把中文区块换成英文区块 ⇒ 被换出去的旧节点
      #      **脱离文档**，而 IntersectionObserver 仍 observe 着它 ⇒ 浏览器不再派发交叠事件
      #      ⇒ 切到英文后顶栏的「当前区块」高亮**整条静默失效**（已用最小 DOM 模拟复现）；
      #   ② 以 <img> 引入的 SVG 没有 width/height ⇒ 浏览器加载前不知道占多大 ⇒ 页面抖。
      # ⇒ 这一道门同时守住：图片尺寸、文档内 id 唯一性、语言切换重绑、脚本版本号。
      - name: Page structure gate (image sizes / id uniqueness / language-switch rebinding)
        run: node scripts/structure-audit.mjs
