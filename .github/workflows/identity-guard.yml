name: identity-guard

# Hard gate: every IO deploy onto the public site must continue to carry
# the full, accurate bio (璧垫鏇?路 SUSTech + CUHK 路 璁＄畻鏈虹瀛︿笌鎶€鏈?路 鍏ㄥ浗涓鐢熺墿鐞嗙珵璧?路 閾滅墝 路
# 姹熻タ鐪佷竴绛夊 路 姹熻タ鐪佷簩绛夊 路 娉曠嫍鐙楀叕鍙?路 闅愮浘 路 搴旂敤宸ョ▼甯?路 闆呮€?6.5 路 IELTS 6.5 路 CET6 546).
# It FAILS if anyone 鈥?including this repository's automated sync pipelines 鈥?
# silently drops or substitutes a word.

"on":
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'manual.html'
      - 'admin.html'
      - '404.html'
      - 'README.md'
      - 'styles.css'
      - 'specproof-web/index.html'
      - 'scripts/identity-guard.mjs'
      - '.github/workflows/identity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    # GitHub-hosted so the IO deploy gate never stalls on an offline self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20 (self-hosted Windows runner PATH lacks node right now)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run identity guard
        run: |
          node scripts/identity-guard.mjs
