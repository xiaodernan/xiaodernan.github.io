name: Sync Football OS showcase card

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sync-football-os.yml"

permissions:
  contents: write

concurrency:
  group: sync-football-os
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the fact pack and paint both language halves
        run: node scripts/sync-football-os.mjs --fetch --write
      - name: Verify static figures and fallback
        run: node scripts/sync-football-os.mjs --check
      - name: Commit if anything moved
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/football/latest.json index.html; then
            echo "no change"
          else
            git config user.name "pages-sync-bot"
            git config user.email "pages-sync-bot@users.noreply.github.com"
            git add assets/football/latest.json index.html
            git commit -m "sync(football-os): refresh showcase facts from master"
            git pull --rebase origin master
            git push
          fi
